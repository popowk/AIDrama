name: Package and release AIDrama
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aidrama-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: aidrama-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: aidrama_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paidrama-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, fileinfo, dom, pdo_mysql, pdo_sqlite, zip, gd
          tools: composer:v2
      - name: Validate and bundle PHP application
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          find app bootstrap config routes database public deploy -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -e public/storage
          if find public -type f \( -name '.env' -o -name '*.sql' -o -name '*.sqlite' -o -name '*.log' -o -name '*.bak' -o -name '*.zip' \) | grep -q .; then
            echo 'Forbidden public files found'; exit 1
          fi
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          php artisan --version
          php artisan route:list
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php artisan migrate --force
          rm -f database/database.sqlite
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php artisan migrate --force
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '\r\n' < VERSION)"
          [[ "$BASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION="${BASE%.*}.$GITHUB_RUN_NUMBER"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Skip duplicate."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/package"
          rsync -a ./ "$RUNNER_TEMP/package/" \
            --exclude='.git/' --exclude='.github/' --exclude='.env' \
            --exclude='storage/' --exclude='node_modules/' --exclude='tests/'
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/package/VERSION"
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/AIDrama.zip" .)
          mkdir -p "$RUNNER_TEMP/installer/current/public"
          cp bootstrap/installer.php "$RUNNER_TEMP/installer/current/public/index.php"
          (cd "$RUNNER_TEMP/installer" && zip -qr "$GITHUB_WORKSPACE/AIDrama-Installer.zip" current)
          sha256sum AIDrama.zip > AIDrama.zip.sha256
          gh release create "$VERSION" AIDrama.zip AIDrama.zip.sha256 AIDrama-Installer.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AIDrama $VERSION" --generate-notes --latest
