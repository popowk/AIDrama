name: Package and release AIDrama
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aidrama-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: aidrama-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: aidrama_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paidrama-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, fileinfo, dom, pdo_mysql, pdo_sqlite, zip, gd
          tools: composer:v2
      - name: Validate and bundle PHP application
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          find app bootstrap config routes database public deploy -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -e public/storage
          if find public -type f \( -name '.env' -o -name '*.sql' -o -name '*.sqlite' -o -name '*.log' -o -name '*.bak' -o -name '*.zip' \) | grep -q .; then
            echo 'Forbidden public files found'; exit 1
          fi
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          php artisan --version
          php artisan route:list
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php artisan migrate --force
          rm -f database/database.sqlite
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php artisan migrate --force
          # Smoke test the stand-alone browser bootstrap without secrets or an installed app
          mkdir -p "$RUNNER_TEMP/aidrama-smoke/public" "$RUNNER_TEMP/aidrama-smoke/bootstrap"
          cp public/index.php "$RUNNER_TEMP/aidrama-smoke/public/index.php"
          cp bootstrap/installer.php "$RUNNER_TEMP/aidrama-smoke/bootstrap/installer.php"
          php -S 127.0.0.1:18868 -t "$RUNNER_TEMP/aidrama-smoke/public" > "$RUNNER_TEMP/installer-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:18868/ -o "$RUNNER_TEMP/installer.html"
          grep -q "验证安装身份" "$RUNNER_TEMP/installer.html"
          test -f "$RUNNER_TEMP/aidrama-smoke/shared/setup-token.txt"
          test ! -e "$RUNNER_TEMP/aidrama-smoke/shared/.env"
          test ! -e "$RUNNER_TEMP/aidrama-smoke/public/shared/setup-token.txt"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish all-in-one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '\r\n' < VERSION)"
          VERSION="${BASE%.*}.$GITHUB_RUN_NUMBER"
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 0; fi
          BUNDLE="$RUNNER_TEMP/bundle"
          mkdir -p "$BUNDLE/public" "$BUNDLE/bootstrap" "$BUNDLE/releases/$VERSION"
          rsync -a ./ "$BUNDLE/releases/$VERSION/" --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='node_modules/' --exclude='tests/' --exclude='bootstrap/cache/'
          cp bootstrap/laravel-entry.php "$BUNDLE/releases/$VERSION/public/index.php"
          printf '%s\n' "$VERSION" > "$BUNDLE/releases/$VERSION/VERSION"
          cp public/index.php public/app.css "$BUNDLE/public/"
          cp bootstrap/installer.php "$BUNDLE/bootstrap/installer.php"
          test ! -e "$BUNDLE/public/storage"
          (cd "$BUNDLE" && zip -qr "$GITHUB_WORKSPACE/AIDrama.zip" .)
          sha256sum AIDrama.zip > AIDrama.zip.sha256
          # Validate actual downloadable ZIP, not just repository sources.
          CHECK_DIR="$RUNNER_TEMP/zip-verify"
          mkdir -p "$CHECK_DIR"
          unzip -q AIDrama.zip -d "$CHECK_DIR"
          test -f "$CHECK_DIR/public/index.php"
          test -f "$CHECK_DIR/bootstrap/installer.php"
          test -f "$CHECK_DIR/releases/$VERSION/vendor/autoload.php"
          test -f "$CHECK_DIR/releases/$VERSION/public/index.php"
          test ! -e "$CHECK_DIR/public/storage"
          test ! -f "$CHECK_DIR/public/.env"
          php -l "$CHECK_DIR/public/index.php"
          php -l "$CHECK_DIR/bootstrap/installer.php"
          php -l "$CHECK_DIR/releases/$VERSION/public/index.php"
          BUNDLE="$BUNDLE" bash tests/install-e2e.sh
          gh release create "$VERSION" AIDrama.zip AIDrama.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AIDrama $VERSION" --generate-notes --latest
