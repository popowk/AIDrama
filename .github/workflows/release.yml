name: Package and release AIDrama
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aidrama-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql57:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: aidrama-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: aidrama_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paidrama-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, fileinfo, dom, pdo_mysql, pdo_sqlite, zip, gd
          tools: composer:v2
      - name: Validate and bundle PHP application
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          find app bootstrap config routes database public deploy -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -e public/storage
          if find public -type f \( -name '.env' -o -name '*.sql' -o -name '*.sqlite' -o -name '*.log' -o -name '*.bak' -o -name '*.zip' \) | grep -q .; then
            echo 'Forbidden public files found'; exit 1
          fi
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          php artisan --version
          php artisan route:list
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php artisan migrate --force
          rm -f database/database.sqlite
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php artisan migrate --force
          php tests/storyboard-table-smoke.php
          php tests/project-generation-layout-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/asset-controls-smoke.php
          node tests/inline-project-ui.test.cjs
          node tests/shot-assets-ui.test.cjs
          node tests/asset-preview-layout.test.cjs
          node tests/asset-large-preview.test.cjs
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/inline-saves-smoke.php
          node tests/inline-settings-ui.test.cjs
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/inline-settings-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/short-video-mode-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/adjacent-shot-duration-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/short-video-continuity-and-assets-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/shot-asset-choices-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/conversation-delivery-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/storyboard-speech-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/combined-shot-editor-smoke.php
          node tests/storyboard-state.test.cjs
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/prompt-optional-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/storyboard-async-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/generation-snapshots-smoke.php
          # Simulate MySQL 5.7's nontransactional DDL: previous upgrade
          # added most columns but crashed before recording the migration.
          php -r '$d=new PDO("mysql:host=127.0.0.1;dbname=aidrama_ci","root","aidrama-ci-only");$d->exec("ALTER TABLE assets DROP COLUMN image_error");$d->exec("ALTER TABLE shots DROP COLUMN delivery");$d->exec("DELETE FROM migrations WHERE migration = '\''2026_11_16_000002_add_media_pipeline_columns'\''");'
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php artisan migrate --force
          php -r '$d=new PDO("mysql:host=127.0.0.1;dbname=aidrama_ci","root","aidrama-ci-only");foreach(["assets"=>["source_kind","image_status","image_error"],"shots"=>["delivery","on_screen_text"],"projects"=>["script_mode","detected_mode"],"generation_jobs"=>["request_mode"]] as $table=>$cols){foreach($cols as $col){$s=$d->prepare("SHOW COLUMNS FROM ".$table." LIKE ?");$s->execute([$col]);if(!$s->fetch()){fwrite(STDERR,"Missing ".$table.".".$col."\n");exit(1);}}}echo "Partial-migration retry on MySQL 5.7 passed\n";'
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/media-pipeline-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/library-smoke.php
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=aidrama_ci DB_USERNAME=root DB_PASSWORD=aidrama-ci-only php tests/model-discovery-smoke.php
          php artisan route:list --path=updates
          php artisan route:list --path=projects
          # Smoke test the stand-alone browser bootstrap without secrets or an installed app
          mkdir -p "$RUNNER_TEMP/aidrama-smoke/public" "$RUNNER_TEMP/aidrama-smoke/bootstrap"
          cp public/index.php "$RUNNER_TEMP/aidrama-smoke/public/index.php"
          cp bootstrap/installer.php "$RUNNER_TEMP/aidrama-smoke/bootstrap/installer.php"
          php -S 127.0.0.1:18868 -t "$RUNNER_TEMP/aidrama-smoke/public" > "$RUNNER_TEMP/installer-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:18868/ -o "$RUNNER_TEMP/installer.html"
          grep -q "验证安装身份" "$RUNNER_TEMP/installer.html"
          test -f "$RUNNER_TEMP/aidrama-smoke/shared/setup-token.txt"
          test ! -e "$RUNNER_TEMP/aidrama-smoke/shared/.env"
          test ! -e "$RUNNER_TEMP/aidrama-smoke/public/shared/setup-token.txt"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish all-in-one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '\r\n' < VERSION)"
          VERSION="${BASE%.*}.$GITHUB_RUN_NUMBER"
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 0; fi
          BUNDLE="$RUNNER_TEMP/bundle"
          mkdir -p "$BUNDLE/public" "$BUNDLE/bootstrap" "$BUNDLE/deploy" "$BUNDLE/releases/$VERSION"
          rsync -a ./ "$BUNDLE/releases/$VERSION/" --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='node_modules/' --exclude='tests/' --exclude='bootstrap/cache/'
          cp bootstrap/laravel-entry.php "$BUNDLE/releases/$VERSION/public/index.php"
          # A durable copy for synchronizing the stable document-root dispatcher during updates.
          cp public/index.php "$BUNDLE/releases/$VERSION/deploy/dispatcher.php"
          printf '%s\n' "$VERSION" > "$BUNDLE/releases/$VERSION/VERSION"
          cp public/index.php public/app.css "$BUNDLE/public/"
          cp bootstrap/installer.php "$BUNDLE/bootstrap/installer.php"
          cp deploy/update.php deploy/diagnose.php "$BUNDLE/deploy/"
          test ! -e "$BUNDLE/public/storage"
          (cd "$BUNDLE" && zip -qr "$GITHUB_WORKSPACE/AIDrama.zip" .)
          sha256sum AIDrama.zip > AIDrama.zip.sha256
          # Validate actual downloadable ZIP, not just repository sources.
          CHECK_DIR="$RUNNER_TEMP/zip-verify"
          mkdir -p "$CHECK_DIR"
          unzip -q AIDrama.zip -d "$CHECK_DIR"
          test -f "$CHECK_DIR/public/index.php"
          test -f "$CHECK_DIR/bootstrap/installer.php"
          test -f "$CHECK_DIR/deploy/update.php"
          test -f "$CHECK_DIR/deploy/diagnose.php"
          test -f "$CHECK_DIR/releases/$VERSION/vendor/autoload.php"
          test -f "$CHECK_DIR/releases/$VERSION/public/index.php"
          test -f "$CHECK_DIR/releases/$VERSION/deploy/dispatcher.php"
          test ! -e "$CHECK_DIR/public/storage"
          test ! -f "$CHECK_DIR/public/.env"
          php -l "$CHECK_DIR/public/index.php"
          php -l "$CHECK_DIR/bootstrap/installer.php"
          php -l "$CHECK_DIR/releases/$VERSION/public/index.php"
          # Exercise the exact files that the user downloads, not the staging folder.
          BUNDLE="$CHECK_DIR" bash tests/install-e2e.sh
          php "$RUNNER_TEMP/drama.tmd.pet/deploy/diagnose.php" > "$RUNNER_TEMP/aidrama-diagnose.txt"
          grep -q 'Laravel bootstrap.*OK' "$RUNNER_TEMP/aidrama-diagnose.txt"
          grep -q 'MySQL connection.*OK' "$RUNNER_TEMP/aidrama-diagnose.txt"
          gh release create "$VERSION" AIDrama.zip AIDrama.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AIDrama $VERSION" --generate-notes --latest
