name: AIDrama pull request checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, fileinfo, dom, pdo_sqlite, zip, gd
          tools: composer:v2
      - name: PHP and Blade syntax, migrations and regression tests
        run: |
          set -euo pipefail
          find app bootstrap config routes database public deploy tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          mkdir -p storage/app/private storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php artisan migrate --force
          php tests/storyboard-table-smoke.php
          php tests/project-generation-layout-smoke.php
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/asset-controls-smoke.php
          node tests/inline-project-ui.test.cjs
          node tests/asset-preview-layout.test.cjs
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/inline-saves-smoke.php
          node tests/inline-settings-ui.test.cjs
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/inline-settings-smoke.php
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/short-video-mode-smoke.php
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/conversation-delivery-smoke.php
          node tests/storyboard-state.test.cjs
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/prompt-optional-smoke.php
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/storyboard-async-smoke.php
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" php tests/generation-snapshots-smoke.php
          php artisan view:cache
          php artisan route:list --path=projects
